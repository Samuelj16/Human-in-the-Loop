# Free Render services sleep after 15 minutes idle and take ~60s to wake, so a
# recruiter clicking a cold link waits a minute at a blank page. This pings the
# health endpoint often enough to keep it up.
#
# Render grants 750 free instance-hours per month and a month is ~730 hours, so
# keeping ONE service always-on fits inside the free allowance. Do not point
# this at a second service.
name: Keep demo warm

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API health endpoint
        env:
          # Repository variable, not a secret - it is a public URL.
          # Settings -> Secrets and variables -> Actions -> Variables -> API_URL
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "API_URL variable is not set; nothing to ping."
            exit 0
          fi
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "$API_URL/api/health" || echo 000)
            echo "attempt $attempt -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "::warning::health check did not return 200"
